name: Reviewed browser acceptance

# Advancing an exact reviewed branch explicitly opts in its acquisition.
# No ordinary PR, main push, schedule, native job or user browser is dispatched.
on:
  push:
    branches: [codex/ui-browser-reviewed, codex/form-browser-reviewed, codex/reference-browser-reviewed, codex/configuration-browser-reviewed, codex/application-host-browser-reviewed, codex/business-application-browser-reviewed, codex/document-form-browser-reviewed]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/codex/ui-browser-reviewed' && 'catalog-browser-reviewed' || github.ref == 'refs/heads/codex/form-browser-reviewed' && 'form-browser-reviewed' || github.ref == 'refs/heads/codex/reference-browser-reviewed' && 'reference-browser-reviewed' || github.ref == 'refs/heads/codex/application-host-browser-reviewed' && 'application-host-browser-reviewed' || github.ref == 'refs/heads/codex/business-application-browser-reviewed' && 'business-application-browser-reviewed' || github.ref == 'refs/heads/codex/document-form-browser-reviewed' && 'document-form-browser-reviewed' || 'configuration-browser-reviewed' }}
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Atridis/yadinassi'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check ordinary unprivileged runner and pinned Node major
        run: |
          test "$(id -u)" != 0
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
      - name: Install runtime and locked QA-only dependencies
        run: |
          python -m pip install -e . wcwidth==0.8.2
          npm ci --prefix tests/browser_ui --ignore-scripts --no-audit --no-fund
      - name: Install only the version-bound browser (no system or security changes)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/node_modules/playwright/cli.js install chromium --no-shell
      - name: Acquire four mixed business flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/business-application-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/business_browser_qa.mjs
      - name: Acquire five document form flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/document-form-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/document_form_browser_qa.mjs
      - name: Acquire five application host lifetime flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/application-host-browser-reviewed'
        timeout-minutes: 8
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/application_host_browser_qa.mjs
      - name: Acquire eight original-demo kind flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/ui-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/demo_kind_browser_qa.mjs
      - name: Acquire five form flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/form-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/form_browser_qa.mjs
      - name: Acquire three reference order flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/reference-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/reference_browser_qa.mjs
      - name: Acquire six configuration and catalog form flows with Chromium sandbox enabled
        if: github.ref == 'refs/heads/codex/configuration-browser-reviewed'
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/configuration_browser_qa.mjs
      - name: Publish only catalog screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/ui-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalog-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-browser-artifacts/list.png
            ${{ runner.temp }}/yadinassi-browser-artifacts/editor.png
            ${{ runner.temp }}/yadinassi-browser-artifacts/narrow.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only form screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/form-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: form-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/estimate.png
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/product-narrow.png
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/order-table-narrow.png
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/order-editor-narrow.png
            ${{ runner.temp }}/yadinassi-form-browser-artifacts/orders-workspace-narrow.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only configuration screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/configuration-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: configuration-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-parameters.png
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-independent.png
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-draft-narrow.png
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-catalog-saved.png
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-catalog-selection.png
            ${{ runner.temp }}/yadinassi-configuration-browser-artifacts/configuration-catalog-narrow.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only application host screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/application-host-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-host-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/application-startup.png
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/application-takeover-draft.png
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/application-resumed.png
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/application-exit-refused.png
            ${{ runner.temp }}/yadinassi-application-host-browser-artifacts/application-clean.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only reference screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/reference-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reference-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-reference-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-reference-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-reference-browser-artifacts/reference-created.png
            ${{ runner.temp }}/yadinassi-reference-browser-artifacts/reference-choice-narrow.png
            ${{ runner.temp }}/yadinassi-reference-browser-artifacts/reference-reopened.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only business application screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/business-application-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: business-application-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/business-startup.png
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/business-product.png
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/business-document.png
            ${{ runner.temp }}/yadinassi-business-browser-artifacts/business-independent.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish only document form screenshots and redacted source-bound report
        if: always() && github.ref == 'refs/heads/codex/document-form-browser-reviewed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: document-form-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/document-new.png
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/document-written.png
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/document-reopened.png
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/document-independent.png
            ${{ runner.temp }}/yadinassi-document-form-browser-artifacts/document-bounded.png
          if-no-files-found: error
          retention-days: 14
