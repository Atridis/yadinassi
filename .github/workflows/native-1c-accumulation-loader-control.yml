name: Temporary accumulation loader control
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: native-accumulation-loader-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  control:
    if: >-
      github.repository == 'Atridis/yadinassi' && github.repository_id == '359770628' &&
      github.repository_owner_id == '30860798' && github.actor == 'Atridis' &&
      github.actor_id == '30860798' && github.triggering_actor == 'Atridis' &&
      github.event.pull_request.head.repo.full_name == 'Atridis/yadinassi' &&
      github.event.pull_request.head.ref == 'codex/accumulation-loader-control' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          lfs: false
      - name: Bind owner identity and exact merge parents before credentials
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          NATIVE_DISPATCH_INPUTS: '{}'
        run: python3 -I -B scripts/native_1c_ci_policy.py bind
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Install pinned host dependencies
        run: python3 -m pip install --disable-pip-version-check --no-deps prompt-toolkit==3.0.53 pyuca==1.2 tzdata==2026.5 wcwidth==0.8.2
      - name: Run one declaration-only load and strict redump control
        id: loader_control
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/native_1c_accumulation_loader_control.py --execute-approved-image
      - name: Upload bounded diagnostic summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-accumulation-loader-control-summary
          path: native-smoke/accumulation-loader-control.json
          if-no-files-found: error
          retention-days: 7
