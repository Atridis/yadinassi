name: Reviewed catalog deletion diagnostic measurement

# A push to this exact reviewed branch explicitly starts one isolated acquisition.
on:
  push:
    branches: [codex/native-catalog-deletion-diagnostic-reviewed]

permissions: {}

concurrency:
  group: native-catalog-deletion-diagnostic-reviewed
  cancel-in-progress: false

jobs:
  admission:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit only the owner and a reviewed branch update
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH'], 'rb') as stream:
              raw = stream.read(8 * 1024 * 1024 + 1)
          if len(raw) > 8 * 1024 * 1024:
              raise SystemExit('event bound')
          event = json.loads(raw)
          repo, owner, sender = event.get('repository', {}), event.get('repository', {}).get('owner', {}), event.get('sender', {})
          sha = os.environ.get('GITHUB_SHA', '')
          checks = [
              os.environ.get('GITHUB_EVENT_NAME') == 'push',
              os.environ.get('GITHUB_REPOSITORY') == 'Atridis/yadinassi',
              os.environ.get('GITHUB_REPOSITORY_ID') == '359770628',
              os.environ.get('GITHUB_REPOSITORY_OWNER_ID') == '30860798',
              os.environ.get('GITHUB_ACTOR') == 'Atridis',
              os.environ.get('GITHUB_ACTOR_ID') == '30860798',
              os.environ.get('TRIGGERING_ACTOR') == 'Atridis',
              os.environ.get('GITHUB_REF') == 'refs/heads/codex/native-catalog-deletion-diagnostic-reviewed',
              os.environ.get('GITHUB_RUN_ATTEMPT') == '1',
              repo.get('full_name') == 'Atridis/yadinassi', repo.get('id') == 359770628,
              owner.get('login') == 'Atridis', owner.get('id') == 30860798,
              sender.get('login') == 'Atridis', sender.get('id') == 30860798,
              event.get('ref') == os.environ.get('GITHUB_REF'),
              event.get('created') is False, event.get('deleted') is False, event.get('forced') is False,
              os.environ.get('GITHUB_WORKFLOW_SHA') == sha,
              bool(re.fullmatch(r'[0-9a-f]{40}', sha)),
              event.get('after') == sha, (event.get('head_commit') or {}).get('id') == sha,
          ]
          if not all(checks):
              raise SystemExit('native admission denied')
          print('Native admission accepted for one source-bound acquisition.')
          PY

  measure:
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          lfs: false
      - name: Bind checkout and reviewed parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "bc025a880a1facd19f0a43deac00c1a1774d47e3"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/native-deletion-diagnostic-reviewed.yml'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Install hash-locked host wheels
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/native-deps.txt" <<'REQ'
          prompt-toolkit==3.0.53 --hash=sha256:01c0891d7f9237d5e339f7d3e42cdae80b7534abb1c7c0e3352efba6231492f2
          pyuca==1.2 --hash=sha256:abaa12e1bd2c7c68ca8396ff8383bc0654a739cef3ae68fd7af58bf29af0a91e
          tzdata==2026.5 --hash=sha256:b683bd1b6659ddcd810ff02ad09ba821d4bf1065072805063eb35c49617905ac
          wcwidth==0.8.2 --hash=sha256:d63947694a0539a1d51e01eda7caf800c291020e6cdd7e28ad7b14dd33ad4f85
          REQ
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/native-deps.txt"
      - name: Observe one isolated infobase
        id: measurement
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/native_1c_catalog_deletion_diagnostic_profile.py --execute-approved-image --export-native-outputs
      - name: Upload finite report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-catalog-deletion-diagnostic-summary
          path: native-smoke/catalog-deletion-diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated observations
        if: always() && steps.measurement.outputs.catalog_deletion_diagnostic_outputs_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-catalog-deletion-diagnostic-outputs
          path: |
            native-smoke/catalog-deletion-diagnostic-outputs/catalog-object.out
            native-smoke/catalog-deletion-diagnostic-outputs/provenance.json
          if-no-files-found: error
          retention-days: 7
