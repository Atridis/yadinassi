name: Retired historical demo DESIGNER comparison
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact source-reviewed 40-character SHA on selected owner branch
        required: true
        type: string
permissions: {}
concurrency:
  group: native-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eligibility:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify owner and exact reviewed source without checkout
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          NATIVE_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          # BEGIN DEMO ADMISSION
          import json
          import os
          import re
          import sys


          def admission(event, context):
              def need(ok):
                  if not ok:
                      raise ValueError('demo_admission_denied')
              def owner(value):
                  return (type(value) is dict and value.get('login') == 'Atridis'
                          and type(value.get('id')) is int and value['id'] == 30860798
                          and value.get('type') == 'User')
              need(type(event) is dict and type(context) is dict)
              expected = dict(GITHUB_REPOSITORY='Atridis/yadinassi', GITHUB_REPOSITORY_ID='359770628',
                              GITHUB_REPOSITORY_OWNER='Atridis', GITHUB_REPOSITORY_OWNER_ID='30860798',
                              GITHUB_ACTOR='Atridis', GITHUB_ACTOR_ID='30860798',
                              NATIVE_TRIGGERING_ACTOR='Atridis', GITHUB_EVENT_NAME='workflow_dispatch',
                              GITHUB_REF_TYPE='branch', GITHUB_BASE_REF='', GITHUB_HEAD_REF='')
              need(all(context.get(key) == value for key, value in expected.items()))
              repo = event.get('repository')
              need(type(repo) is dict and repo.get('full_name') == 'Atridis/yadinassi'
                   and type(repo.get('id')) is int and repo['id'] == 359770628
                   and repo.get('fork') is False and owner(repo.get('owner')) and owner(event.get('sender')))
              sha, ref = context.get('GITHUB_SHA'), context.get('GITHUB_REF')
              need(type(sha) is str and re.fullmatch('[0-9a-f]{40}', sha) is not None and sha != '0' * 40)
              need(type(ref) is str and re.fullmatch(r'refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]{0,239}', ref) is not None
                   and '..' not in ref and '//' not in ref and not ref.endswith(('/', '.'))
                   and all(not part.startswith('.') and not part.endswith('.lock') for part in ref.split('/')))
              need(event.get('ref') in (ref, ref.removeprefix('refs/heads/')))
              need(context.get('GITHUB_WORKFLOW_SHA') == sha and context.get('GITHUB_WORKFLOW_REF') ==
                   'Atridis/yadinassi/.github/workflows/native-1c-demo-designer.yml@' + ref)
              need(event.get('inputs') == {'reviewed_sha': sha})
              need(json.loads(context.get('NATIVE_DISPATCH_INPUTS', 'null'), object_pairs_hook=unique) == {'reviewed_sha': sha})
              return sha


          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError('demo_admission_denied')
                  value[key] = item
              return value


          def check_environment():
              with open(os.environ['GITHUB_EVENT_PATH'], 'rb') as source:
                  raw = source.read(8 * 1048576 + 1)
              if len(raw) > 8 * 1048576:
                  raise ValueError('demo_admission_denied')
              return admission(json.loads(raw, object_pairs_hook=unique), dict(os.environ))
          # END DEMO ADMISSION
          try:
              check_environment()
          except Exception:
              raise SystemExit('Demo admission denied.')
          PYTHON
  designer:
    needs: eligibility
    if: ${{ false }} # Retired: historical redump is offline-only.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Bind clean checkout to exact reviewed source
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          NATIVE_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: python3 -I -B scripts/native_1c_demo_ci_policy.py
      - name: Load, check, update and redump demo without ENTERPRISE
        id: designer
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 demo-native-report
          if python3 -B scripts/native_1c_demo_designer.py --execute-approved-image > demo-native-report/report.json; then
            status=0
          else
            status=$?
          fi
          python3 -I -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path('demo-native-report/report.json').read_bytes())
          if (value.get('schema') == 'native-demo-designer-v5-host'
                  and value.get('container_cleanup_verified') is True
                  and value.get('docker_cli_reap_verified') is True
                  and value.get('xml_export') == {'state': 'available', 'reason': 'none', 'files': 15}):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print('xml_export=available', file=output)
          PYTHON
          exit "$status"
      - name: Upload finite validated report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-designer-summary
          path: demo-native-report/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated public-demo XML only
        if: always() && steps.designer.outputs.xml_export == 'available'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-designer-xml-evidence
          path: |
            demo-native-evidence/payload/report.json
            demo-native-evidence/payload/manifest.json
            demo-native-evidence/payload/xml/00.xml
            demo-native-evidence/payload/xml/01.xml
            demo-native-evidence/payload/xml/02.xml
            demo-native-evidence/payload/xml/03.xml
            demo-native-evidence/payload/xml/04.xml
            demo-native-evidence/payload/xml/05.xml
            demo-native-evidence/payload/xml/06.xml
            demo-native-evidence/payload/xml/07.xml
            demo-native-evidence/payload/xml/08.xml
            demo-native-evidence/payload/xml/09.xml
            demo-native-evidence/payload/xml/10.xml
            demo-native-evidence/payload/xml/11.xml
            demo-native-evidence/payload/xml/12.xml
            demo-native-evidence/payload/xml/13.xml
            demo-native-evidence/payload/xml/14.xml
          if-no-files-found: error
          retention-days: 7
