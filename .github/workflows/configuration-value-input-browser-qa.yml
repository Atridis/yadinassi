name: Configuration value input browser QA (reviewed opt-in)

on:
  push:
    branches: [codex/configuration-value-input-browser-reviewed]

permissions:
  contents: read

concurrency:
  group: configuration-value-input-browser-reviewed
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Atridis/yadinassi'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check ordinary unprivileged runner and pinned Node major
        run: |
          test "$(id -u)" != 0
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
      - name: Install runtime and locked QA-only dependencies
        run: |
          python -m pip install -e . wcwidth==0.8.2
          npm ci --prefix tests/browser_ui --ignore-scripts --no-audit --no-fund
      - name: Install only the version-bound browser (no system or security changes)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/node_modules/playwright/cli.js install chromium --no-shell
      - name: Acquire four typed input flows with Chromium sandbox enabled
        timeout-minutes: 5
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/configuration_value_input_browser_qa.mjs
      - name: Publish only results screenshots and redacted source-bound report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: configuration-value-input-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/input-completion.png
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/input-date-choice.png
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/input-retained.png
            ${{ runner.temp }}/yadinassi-value-input-browser-artifacts/input-locked-copy.png
          if-no-files-found: error
          retention-days: 14
