        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          import os
          # BEGIN NATIVE DB ORACLE CI VERDICT
          def final_verdict(eligibility_result, native_result):
              # Skipped, cancelled, unavailable and failed native runs are never green.
              return 0 if eligibility_result == "success" and native_result == "success" else 1
          # END NATIVE DB ORACLE CI VERDICT
          # BEGIN NATIVE DB ORACLE ROUTE VERDICT
          def selected_native_result(route, reference_a, reference_b, codec_a, codec_b, metadata="skipped", runtime="skipped", catalog_read="skipped"):
              if route == "catalog-reference-identity-v1":
                  passed = reference_a == reference_b == "success" and codec_a == codec_b == metadata == runtime == catalog_read == "skipped"
              elif route in ("catalog-reference-codec-v1", "catalog-reference-rows-v1", "catalog-description-measurement-v1", "catalog-description-rows-v1", "catalog-params-slot-measurement-v1", "catalog-numeric-code-measurement-v1", "catalog-numeric-code-rows-v1", "catalog-zero-code-measurement-v1", "catalog-zero-code-rows-v1"):
                  passed = codec_a == codec_b == "success" and reference_a == reference_b == metadata == runtime == catalog_read == "skipped"
