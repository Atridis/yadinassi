name: Reviewed native 1C file-DB oracle

# Advancing this one owner-reviewed branch explicitly opts in its exact SHA.
# Admission is not a privacy boundary against workflow edits or the existing
# public-repository package grant. This lane never changes the six-output lane.
on:
  push:
    branches: [codex/native-file-db-oracle-reviewed]

permissions: {}

concurrency:
  group: native-1c-file-db-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: File-DB oracle eligibility
    outputs:
      route: ${{ steps.admission.outputs.route }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate owner, repository, reviewed push and revision without checkout
        id: admission
        env:
          NATIVE_DB_ROUTE: catalog-read-batch-v1
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          # BEGIN NATIVE DB ORACLE CI ADMISSION
          import json
          import os
          import re
          import sys

          REPOSITORY = "Atridis/yadinassi"
          REPOSITORY_ID = 359770628
          OWNER = "Atridis"
          OWNER_ID = 30860798
          REVIEWED_REF = "refs/heads/codex/native-file-db-oracle-reviewed"
          WORKFLOW_PATH = ".github/workflows/native-1c-file-db-oracle.yml"
          MAX_EVENT_BYTES = 8 * 1024 * 1024


          class PolicyError(Exception):
              """A finite reason safe to emit without printing event data."""


          def require(condition, reason):
              if not condition:
                  raise PolicyError(reason)


          def object_value(value):
              return value if type(value) is dict else {}


          def is_sha(value):
              return (type(value) is str and re.fullmatch(r"[0-9a-f]{40}", value) is not None
                      and value != "0" * 40)


          def owner_identity(value):
              value = object_value(value)
              return (value.get("login") == OWNER and type(value.get("id")) is int
                      and value["id"] == OWNER_ID and value.get("type") == "User")


          def trusted_repository(value):
              value = object_value(value)
              return (value.get("full_name") == REPOSITORY and type(value.get("id")) is int
                      and value["id"] == REPOSITORY_ID and value.get("fork") is False
                      and owner_identity(value.get("owner")))


          def validate_admission(event, context):
              require(type(event) is dict and type(context) is dict, "event_invalid")
              expected = {
                  "GITHUB_REPOSITORY": REPOSITORY,
                  "GITHUB_REPOSITORY_ID": str(REPOSITORY_ID),
                  "GITHUB_REPOSITORY_OWNER": OWNER,
                  "GITHUB_REPOSITORY_OWNER_ID": str(OWNER_ID),
                  "GITHUB_ACTOR": OWNER,
                  "GITHUB_ACTOR_ID": str(OWNER_ID),
                  # triggering_actor has a login but no numeric ID in GitHub's context.
                  # Bind that unique login to the independently checked repository owner.
                  "NATIVE_TRIGGERING_ACTOR": OWNER,
              }
              require(all(context.get(key) == value for key, value in expected.items()), "identity_not_approved")
              require(trusted_repository(event.get("repository")), "repository_not_approved")
              require(owner_identity(event.get("sender")), "sender_not_approved")
              require(context.get("GITHUB_EVENT_NAME") == "push", "event_not_approved")
              require(context.get("GITHUB_REF") == REVIEWED_REF and event.get("ref") == REVIEWED_REF,
                      "push_ref_not_approved")
              require(context.get("GITHUB_REF_TYPE") == "branch"
                      and context.get("GITHUB_BASE_REF") == "" and context.get("GITHUB_HEAD_REF") == "",
                      "push_reviewed_context_invalid")
              require(event.get("forced") is False, "push_forced_or_invalid")
              require(event.get("deleted") is False, "push_deleted_or_invalid")
              require(is_sha(context.get("GITHUB_SHA")), "revision_invalid")
              require(event.get("after") == context["GITHUB_SHA"]
                      and object_value(event.get("head_commit")).get("id") == context["GITHUB_SHA"],
                      "push_revision_mismatch")
              require(context.get("GITHUB_WORKFLOW_REF") == f"{REPOSITORY}/{WORKFLOW_PATH}@{REVIEWED_REF}"
                      and context.get("GITHUB_WORKFLOW_SHA") == context["GITHUB_SHA"],
                      "push_workflow_revision_mismatch")
              return "push"


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "event_invalid")
                  result[key] = value
              return result


          def reject_constant(_value):
              raise PolicyError("event_invalid")


          def read_event(context):
              try:
                  with open(context["GITHUB_EVENT_PATH"], "rb") as stream:
                      data = stream.read(MAX_EVENT_BYTES + 1)
                  require(len(data) <= MAX_EVENT_BYTES, "event_invalid")
                  return json.loads(data, object_pairs_hook=unique_object, parse_constant=reject_constant)
              except (OSError, ValueError, KeyError, TypeError, RecursionError):
                  raise PolicyError("event_invalid") from None


          def admission_main():
              try:
                  validate_admission(read_event(os.environ), dict(os.environ))
              except PolicyError as error:
                  print(f"Native DB oracle CI blocked: {error}", file=sys.stderr)
                  return 1
              print("Native DB oracle CI admission accepted.")
              return 0
          # END NATIVE DB ORACLE CI ADMISSION
          # BEGIN NATIVE DB ORACLE ROUTE ADMISSION
          def admitted_route(value):
              if value not in ("catalog-reference-identity-v1", "catalog-reference-codec-v1", "catalog-reference-rows-v1", "catalog-description-measurement-v1", "catalog-description-rows-v1", "catalog-params-slot-measurement-v1", "catalog-numeric-code-measurement-v1", "catalog-numeric-code-rows-v1", "catalog-zero-code-measurement-v1", "catalog-zero-code-rows-v1", "metadata-catalog-applied-view-v1", "metadata-catalog-public-runtime-v1", "catalog-read-batch-v1"):
                  raise PolicyError("route_not_approved")
              return value
          # END NATIVE DB ORACLE ROUTE ADMISSION
          result = admission_main()
          if result == 0:
              try:
                  route = admitted_route(os.environ.get("NATIVE_DB_ROUTE"))
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as output:
                      output.write("route=" + route + "\n")
              except (PolicyError, KeyError, OSError):
                  print("Native DB oracle CI blocked: route_not_approved", file=sys.stderr)
                  result = 1
          raise SystemExit(result)
          PYTHON

  native_reference_a:
    name: Native 1C reference identity case A
    needs: eligibility
    if: >-
      needs.eligibility.outputs.route == 'catalog-reference-identity-v1' &&
      needs.eligibility.result == 'success' &&
      github.repository == 'Atridis/yadinassi' &&
      github.repository_id == '359770628' &&
      github.repository_owner == 'Atridis' &&
      github.repository_owner_id == '30860798' &&
      github.actor == 'Atridis' &&
      github.actor_id == '30860798' &&
      github.triggering_actor == 'Atridis' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.ref_type == 'branch' &&
      github.base_ref == '' && github.head_ref == '' &&
      github.event.ref == github.ref &&
      github.event.deleted == false && github.event.forced == false &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.workflow_ref == 'Atridis/yadinassi/.github/workflows/native-1c-file-db-oracle.yml@refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.workflow_sha == github.sha
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # The host has one 2400-second execution deadline plus bounded cleanup.
    # This outer budget also includes checkout, authentication and report upload.
    timeout-minutes: 50
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      reference_sha256: ${{ steps.native.outputs.reference_sha256 }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify immutable reviewed checkout before exposing the package token
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 -I -B scripts/native_1c_db_oracle_ci_policy.py bind
      - name: Run approved digest with no network, ports or container credentials
        id: native
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-reference-identity distinct_a --output native-db-oracle/distinct_a.json
      - name: Require validated report readiness on native success
        if: always() && steps.native.outcome == 'success'
        env:
          NATIVE_REPORT_READY: ${{ steps.native.outputs.report_ready }}
        shell: bash
        run: test "${NATIVE_REPORT_READY}" = "true"
      # The host emits report_ready only after strict finite-schema validation
      # and the 32 KiB cap, including sanitized failures. Never upload raw files.
      - name: Upload only the validated finite case A report
        id: upload
        if: always() && steps.native.outputs.report_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-1c-reference-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-db-oracle/distinct_a.json
          if-no-files-found: error
          retention-days: 7

  native_oracle:
    name: Native 1C reference identity case B
    needs: [eligibility, native_reference_a]
    if: >-
      needs.eligibility.outputs.route == 'catalog-reference-identity-v1' &&
      needs.eligibility.result == 'success' && needs.native_reference_a.result == 'success' &&
      github.repository == 'Atridis/yadinassi' &&
      github.repository_id == '359770628' &&
      github.repository_owner == 'Atridis' &&
      github.repository_owner_id == '30860798' &&
      github.actor == 'Atridis' &&
      github.actor_id == '30860798' &&
      github.triggering_actor == 'Atridis' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.ref_type == 'branch' &&
      github.base_ref == '' && github.head_ref == '' &&
      github.event.ref == github.ref &&
      github.event.deleted == false && github.event.forced == false &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.workflow_ref == 'Atridis/yadinassi/.github/workflows/native-1c-file-db-oracle.yml@refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.workflow_sha == github.sha
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # The host has one 2400-second execution deadline plus bounded cleanup.
    # This outer budget also includes checkout, authentication and report upload.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify immutable reviewed checkout before exposing the package token
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 -I -B scripts/native_1c_db_oracle_ci_policy.py bind
      - name: Require exact case A artifact identifier before download
        env:
          REFERENCE_A_ARTIFACT_ID: ${{ needs.native_reference_a.outputs.artifact_id }}
        run: python3 -I -B -c 'import os,re; raise SystemExit(0 if re.fullmatch(r"[1-9][0-9]{0,19}",os.environ.get("REFERENCE_A_ARTIFACT_ID","")) else 1)'
      - name: Download only case A from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.native_reference_a.outputs.artifact_id }}
          path: native-db-oracle
          digest-mismatch: error
      - name: Authenticate exact case A handoff before exposing package credentials
        env:
          REFERENCE_A_SHA256: ${{ needs.native_reference_a.outputs.reference_sha256 }}
          REFERENCE_A_RUN_ID: ${{ needs.native_reference_a.outputs.run_id }}
          REFERENCE_A_RUN_ATTEMPT: ${{ needs.native_reference_a.outputs.run_attempt }}
        run: python3 scripts/native_1c_db_oracle.py --validate-reference-a
      - name: Run approved digest with no network, ports or container credentials
        id: native
        env:
          REFERENCE_A_SHA256: ${{ needs.native_reference_a.outputs.reference_sha256 }}
          REFERENCE_A_RUN_ID: ${{ needs.native_reference_a.outputs.run_id }}
          REFERENCE_A_RUN_ATTEMPT: ${{ needs.native_reference_a.outputs.run_attempt }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-reference-identity distinct_b --output native-db-oracle/distinct_b.json
      - name: Require validated report readiness on native success
        if: always() && steps.native.outcome == 'success'
        env:
          NATIVE_REPORT_READY: ${{ steps.native.outputs.report_ready }}
        shell: bash
        run: test "${NATIVE_REPORT_READY}" = "true"
      # The host emits report_ready only after strict finite-schema validation
      # and the 32 KiB cap, including sanitized failures. Never upload raw files.
      - name: Upload only the validated finite DB-oracle report
        if: always() && steps.native.outputs.report_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-1c-reference-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-db-oracle/distinct_b.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only the finite hash-bound two-case aggregate
        if: always() && steps.native.outputs.aggregate_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-1c-reference-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-db-oracle/reference-aggregate.json
          if-no-files-found: error
          retention-days: 7

  native_codec_a:
    name: Native 1C reference codec case A
    needs: eligibility
    if: >-
      (needs.eligibility.outputs.route == 'catalog-reference-codec-v1' || needs.eligibility.outputs.route == 'catalog-reference-rows-v1' || needs.eligibility.outputs.route == 'catalog-description-measurement-v1' || needs.eligibility.outputs.route == 'catalog-description-rows-v1' || needs.eligibility.outputs.route == 'catalog-params-slot-measurement-v1' || needs.eligibility.outputs.route == 'catalog-numeric-code-measurement-v1' || needs.eligibility.outputs.route == 'catalog-numeric-code-rows-v1' || needs.eligibility.outputs.route == 'catalog-zero-code-measurement-v1' || needs.eligibility.outputs.route == 'catalog-zero-code-rows-v1') &&
      needs.eligibility.result == 'success' &&
      github.repository == 'Atridis/yadinassi' &&
      github.repository_id == '359770628' &&
      github.repository_owner == 'Atridis' &&
      github.repository_owner_id == '30860798' &&
      github.actor == 'Atridis' &&
      github.actor_id == '30860798' &&
      github.triggering_actor == 'Atridis' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.ref_type == 'branch' &&
      github.base_ref == '' && github.head_ref == '' &&
      github.event.ref == github.ref &&
      github.event.deleted == false && github.event.forced == false &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.workflow_ref == 'Atridis/yadinassi/.github/workflows/native-1c-file-db-oracle.yml@refs/heads/codex/native-file-db-oracle-reviewed' &&
      github.workflow_sha == github.sha
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # The host has one 2400-second execution deadline plus bounded cleanup.
    # This outer budget also includes checkout, authentication and report upload.
    timeout-minutes: 50
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      reference_sha256: ${{ steps.native.outputs.reference_sha256 }}
      description_sha256: ${{ steps.native.outputs.description_sha256 }}
      description_rows_sha256: ${{ steps.native.outputs.description_rows_sha256 }}
      params_slots_sha256: ${{ steps.native.outputs.params_slots_sha256 }}
      numeric_code_sha256: ${{ steps.native.outputs.numeric_code_sha256 }}
      numeric_code_rows_sha256: ${{ steps.native.outputs.numeric_code_rows_sha256 }}
      zero_code_sha256: ${{ steps.native.outputs.zero_code_sha256 }}
      zero_code_rows_sha256: ${{ steps.native.outputs.zero_code_rows_sha256 }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify immutable reviewed checkout before exposing the package token
        env:
          NATIVE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 -I -B scripts/native_1c_db_oracle_ci_policy.py bind
      - name: Run approved digest with no network, ports or container credentials
        id: native
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.eligibility.outputs.route }}" = catalog-zero-code-rows-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-zero-code-rows zero0 --output native-db-oracle/zero_code_rows0.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-zero-code-measurement-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-zero-code zero0 --output native-db-oracle/zero_code0.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-numeric-code-rows-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-numeric-code-rows number3 --output native-db-oracle/numeric_code_rows3.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-numeric-code-measurement-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-numeric-code number3 --output native-db-oracle/numeric_code3.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-params-slot-measurement-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-params-slots description8 --output native-db-oracle/params_slots8.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-description-rows-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-description-rows description8 --output native-db-oracle/description_rows8.json
          elif [ "${{ needs.eligibility.outputs.route }}" = catalog-description-measurement-v1 ]; then
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-description description8 --output native-db-oracle/description8.json
          else
            python3 scripts/native_1c_db_oracle.py --execute-approved-image --file-db-oracle --catalog-reference-${{ needs.eligibility.outputs.route == 'catalog-reference-rows-v1' && 'rows' || 'codec' }} distinct_a --output native-db-oracle/${{ needs.eligibility.outputs.route == 'catalog-reference-rows-v1' && 'rows' || 'codec' }}_distinct_a.json
          fi
      - name: Require validated report readiness on native success
        if: always() && steps.native.outcome == 'success'
        env:
          NATIVE_REPORT_READY: ${{ steps.native.outputs.report_ready }}
        shell: bash
        run: test "${NATIVE_REPORT_READY}" = "true"
      # The host emits report_ready only after strict finite-schema validation
      # and the 32 KiB cap, including sanitized failures. Never upload raw files.
      - name: Upload only the validated finite case A report
        id: upload
        if: always() && steps.native.outputs.report_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-1c-${{ needs.eligibility.outputs.route == 'catalog-zero-code-rows-v1' && 'zero-code-rows' || needs.eligibility.outputs.route == 'catalog-zero-code-measurement-v1' && 'zero-code' || needs.eligibility.outputs.route == 'catalog-numeric-code-rows-v1' && 'numeric-code-rows' || needs.eligibility.outputs.route == 'catalog-numeric-code-measurement-v1' && 'numeric-code' || needs.eligibility.outputs.route == 'catalog-params-slot-measurement-v1' && 'params-slots' || needs.eligibility.outputs.route == 'catalog-description-rows-v1' && 'description-rows' || needs.eligibility.outputs.route == 'catalog-description-measurement-v1' && 'description' || needs.eligibility.outputs.route == 'catalog-reference-rows-v1' && 'rows' || 'codec' }}-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-db-oracle/${{ needs.eligibility.outputs.route == 'catalog-zero-code-rows-v1' && 'zero_code_rows0.json' || needs.eligibility.outputs.route == 'catalog-zero-code-measurement-v1' && 'zero_code0.json' || needs.eligibility.outputs.route == 'catalog-numeric-code-rows-v1' && 'numeric_code_rows3.json' || needs.eligibility.outputs.route == 'catalog-numeric-code-measurement-v1' && 'numeric_code3.json' || needs.eligibility.outputs.route == 'catalog-params-slot-measurement-v1' && 'params_slots8.json' || needs.eligibility.outputs.route == 'catalog-description-rows-v1' && 'description_rows8.json' || needs.eligibility.outputs.route == 'catalog-description-measurement-v1' && 'description8.json' || format('{0}_distinct_a.json', needs.eligibility.outputs.route == 'catalog-reference-rows-v1' && 'rows' || 'codec') }}
          if-no-files-found: error
          retention-days: 7

  native_codec_b:
    name: Native 1C reference codec case B
    needs: [eligibility, native_codec_a]
    if: >-
      (needs.eligibility.outputs.route == 'catalog-reference-codec-v1' || needs.eligibility.outputs.route == 'catalog-reference-rows-v1' || needs.eligibility.outputs.route == 'catalog-description-measurement-v1' || needs.eligibility.outputs.route == 'catalog-description-rows-v1' || needs.eligibility.outputs.route == 'catalog-params-slot-measurement-v1' || needs.eligibility.outputs.route == 'catalog-numeric-code-measurement-v1' || needs.eligibility.outputs.route == 'catalog-numeric-code-rows-v1' || needs.eligibility.outputs.route == 'catalog-zero-code-measurement-v1' || needs.eligibility.outputs.route == 'catalog-zero-code-rows-v1') &&
