name: Test and build

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yadinassi-build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

env:
  PYTHONIOENCODING: utf-8

jobs:
  regex-python310:
    name: Python 3.10 regex compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: tests:scripts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install pinned runtime dependencies
        run: python -m pip install -e . wcwidth==0.8.2
      - name: Verify actual CPython 3.10
        run: python -c "import sys; print(sys.version); raise SystemExit(0 if sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 10) else 1)"
      - name: Test bounded regex workflows
        run: python -m unittest test_regex_family test_native_regex_family_measurement test_native_regex_family_profile -v
      - name: Test bounded regex workflows optimized
        run: python -O -m unittest test_regex_family test_native_regex_family_measurement test_native_regex_family_profile -v
      - name: Test timing runner on actual Python 3.10
        run: python -m scripts.run_tests test_test_durations test_test_partition test_ci_test_gate test_refresh_test_durations -v
      - name: Test timing runner optimized on actual Python 3.10
        run: python -O -m scripts.run_tests test_test_durations test_test_partition test_ci_test_gate test_refresh_test_durations -v

  admission:
    name: Bind exact candidate head and base
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.admit.outputs.heavy }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      light_matrix: ${{ steps.admit.outputs.light_matrix }}
      heavy_matrix: ${{ steps.admit.outputs.heavy_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate live head/base and immutable PR merge parents
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_test_gate.py admit --output ci-binding/binding.json
      - uses: actions/upload-artifact@v7
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding/binding.json
          if-no-files-found: error

  javascript:
    name: JavaScript client and browser support tests
    needs: admission
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding
      - name: Verify exact admitted checkout
        run: python scripts/ci_test_gate.py checkout --binding ci-binding/binding.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked asset builder dependencies
        run: npm ci --prefix frontend/catalog --ignore-scripts --no-audit --no-fund
      - name: Build all frontend assets in dependency order
        run: |
          for frontend in catalog form configuration workspace reference-workspace source-workspace main-demo; do
            node frontend/$frontend/build.mjs
          done
      - name: Require committed assets to match their source
        run: test -z "$(git status --porcelain --untracked-files=all -- yadinassi/ui/assets)"
      - name: Test every client and browser support suite
        run: node --test frontend/*/test/*.test.mjs tests/browser_ui/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ordinary browser smoke dependencies
        run: |
          test "$(id -u)" != 0
          python -m pip install -e . wcwidth==0.8.2
          npm ci --prefix tests/browser_ui --ignore-scripts --no-audit --no-fund
      - name: Install version-bound Chromium without system changes
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/node_modules/playwright/cli.js install chromium --no-shell
      # Reuse the bounded five-scenario sandboxed suite, not a native parity gate.
      - name: Ordinary main-demo browser smoke on exact admitted source
        timeout-minutes: 6
        env:
          QA_SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/yadinassi-browser-binaries
        run: node tests/browser_ui/main_demo_browser_qa.mjs
      - name: Publish source-bound browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-browser-${{ needs.admission.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yadinassi-browser-artifacts/source-binding.json
            ${{ runner.temp }}/yadinassi-browser-artifacts/result.json
            ${{ runner.temp }}/yadinassi-browser-artifacts/manifest.json
            ${{ runner.temp }}/yadinassi-browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

  # Informational timings run independently of admission and all required jobs.
  performance:
    name: Performance reference (Python / BSL, no speed gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Measure the exact candidate, including stacked and draft PRs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -e . wcwidth==0.8.2
      - name: Measure explicitly isolated recovered bare subset
        if: ${{ !cancelled() }}
        run: |
          python -m unittest tests.test_benchmark_recovery tests.test_benchmark_recovered_drivers
          python scripts/benchmark_recovered_drivers.py --output performance-results/recovered-bare.json --rounds 5 --size 4096
      - name: Publish isolated bare coverage and preliminary measurements
        if: ${{ !cancelled() }}
        run: |
          if [ -f performance-results/recovered-bare.md ]; then
            cat performance-results/recovered-bare.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Изолированный bare: отчёт не создан; это не успешный замер.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check benchmark correctness and report formatting
        run: python -m unittest tests.test_benchmark_execution_layers tests.test_benchmark_summary tests.test_benchmark_report
      - name: Measure Python and BSL
        run: |
          mkdir -p performance-results
          python scripts/benchmark_execution_layers.py --bsl-route default --iterations 100000 --rounds 9 > performance-results/execution-layers.json
      - name: Render default timing table
        run: |
          python scripts/benchmark_summary.py performance-results/execution-layers.json > performance-results/summary.md
      - name: Measure prepared execution separately
        run: |
          python scripts/benchmark_execution_layers.py --bsl-route prepared --iterations 100000 --rounds 9 > performance-results/execution-layers-prepared.json
          python scripts/benchmark_summary.py performance-results/execution-layers-prepared.json > performance-results/summary-prepared.md
      - name: Check extended benchmark correctness
        run: python -m unittest tests.test_benchmark_extended_layers tests.test_benchmark_sqlite_update_reference
      - name: Measure extended default reference
        run: |
          python scripts/benchmark_extended_layers.py --iterations 64 --rounds 5 --bsl-route default --output performance-results/extended-default.json --summary performance-results/extended-default.md
      - name: Measure extended prepared reference
        run: |
          python scripts/benchmark_extended_layers.py --iterations 64 --rounds 5 --bsl-route prepared --output performance-results/extended-prepared.json --summary performance-results/extended-prepared.md
      - name: Publish paired performance summary
        if: ${{ !cancelled() }}
        run: python scripts/benchmark_report.py --directory performance-results --output performance-results/summary-paired.md >> "$GITHUB_STEP_SUMMARY"
      - name: Collect separate untimed execution diagnostics
        run: |
          python -m unittest tests.test_benchmark_diagnostics
          python scripts/benchmark_diagnostics.py --iterations 8 --output performance-results/diagnostics.json --summary performance-results/diagnostics.md
          cat performance-results/diagnostics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Explain incomplete results
        if: failure()
        run: echo 'Сравнение производительности не завершено. См. шаг с ошибкой и исходный артефакт. Порогов скорости нет; ошибки подготовки, корректности и измерения приводят к сбою этой задачи.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

  # Diagnostic only: intentionally outside required verdict and release dependencies.
  compatibility:
    name: "Совместимость с 1С: известные расхождения"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -e . wcwidth==0.8.2
      - name: Compare historical ValueTable ordering with 1C
        id: table_order
        run: python -m tests.compatibility_native_table_sort --summary-output native-table-order-summary.md > native-table-order.md
      - name: Compare Array bounds error wording with the documented 1C phrase
        if: ${{ !cancelled() }}
        id: error_wording
        run: python -m tests.compatibility_error_wording > error-wording.md
      - name: Publish known compatibility differences
        if: ${{ !cancelled() }}
        env:
          TABLE_ORDER_OUTCOME: ${{ steps.table_order.outcome }}
          ERROR_WORDING_OUTCOME: ${{ steps.error_wording.outcome }}
        run: |
          {
            echo '## Известные расхождения с 1С'
            echo
            echo '| Область | Проверка | Приоритет |'
            echo '|---|---|---|'
            echo '| ТаблицаЗначений | Точный порядок строк после сортировки | Низкий |'
            echo '| Массив | Формулировка ошибки при чтении за границей | Низкий |'
            echo
            echo 'Диагностика не блокирует CI. Обычные тесты данных остаются обязательными.'
            echo
            if [ "$TABLE_ORDER_OUTCOME" = success ]; then
              cat native-table-order-summary.md
            else
              echo '**Сравнение не завершилось.** См. ошибку или пропущенный шаг в логе; число расхождений неизвестно.'
            fi
            echo
            if [ "$ERROR_WORDING_OUTCOME" = success ]; then
              cat error-wording.md
            else
              echo '**Формулировка ошибок не проверена.** См. лог диагностического шага.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.table_order.outcome == 'success' || steps.error_wording.outcome == 'success') }}
        with:
          name: compatibility-differences-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-table-order.md
            error-wording.md
          if-no-files-found: error
          retention-days: 30

  light:
    name: Light tests (${{ matrix.target }})
    needs: admission
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'mac-x86' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admission.outputs.light_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding
      - name: Verify exact admitted checkout
        run: python scripts/ci_test_gate.py checkout --binding ci-binding/binding.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned runtime dependencies
        run: python -m pip install -e . wcwidth==0.8.2
      - name: Test native launcher without 1C
        run: python integrational_tests/check_launcher.py
      - name: Run every light module (unknown tests included)
        id: partition
        run: python -m scripts.test_partition --tier light --report test-results/partition.json
      - name: Bind partition result to admitted source
        id: stamp
        if: ${{ !cancelled() && (steps.partition.outcome == 'success' || steps.partition.outcome == 'failure') && hashFiles('test-results/partition.json') != '' }}
        run: python scripts/ci_test_gate.py stamp --binding ci-binding/binding.json --report test-results/partition.json --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.stamp.outcome == 'success' }}
        with:
          name: partition-${{ github.run_attempt }}-${{ matrix.target }}-light-0
          path: test-results/partition.json
          if-no-files-found: error

  heavy:
    name: Heavy tests (${{ matrix.target }}, ${{ matrix.shard_index }})
    needs: [admission, light]
    if: needs.admission.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admission.outputs.heavy_matrix) }}
    runs-on: ${{ matrix.os }}
    # Measured history selects heavy fixture groups; unknown tests stay light.
    # Eight complete/disjoint shards on mac-x86, two on other platforms.
    # Preserve the 60-minute bound without dropping tests on slower Intel Macs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding
      - name: Verify exact admitted checkout
        run: python scripts/ci_test_gate.py checkout --binding ci-binding/binding.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned runtime dependencies
        run: python -m pip install -e . wcwidth==0.8.2
      - name: Run deterministic duration-balanced heavy partition
        id: partition
        run: python -m scripts.test_partition --tier heavy --shard-count ${{ matrix.shard_count }} --shard-index ${{ matrix.shard_index }} --report test-results/partition.json
      - name: Bind partition result to admitted source
        id: stamp
        if: ${{ !cancelled() && (steps.partition.outcome == 'success' || steps.partition.outcome == 'failure') && hashFiles('test-results/partition.json') != '' }}
        run: python scripts/ci_test_gate.py stamp --binding ci-binding/binding.json --report test-results/partition.json --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.stamp.outcome == 'success' }}
        with:
          name: partition-${{ github.run_attempt }}-${{ matrix.target }}-heavy-${{ matrix.shard_index }}
          path: test-results/partition.json
          if-no-files-found: error

  build:
    name: Package (${{ matrix.target }})
    needs: [admission, heavy]
    if: needs.admission.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admission.outputs.light_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding
      - name: Verify exact admitted checkout
        run: python scripts/ci_test_gate.py checkout --binding ci-binding/binding.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[build]" wcwidth==0.8.2
      - name: Build, test binary, and create archive
        id: package
        env:
          YADINASSI_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python scripts/build.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive-path }}
          archive: false
          if-no-files-found: error

  verdict:
    name: Exact-source test coverage verdict
    needs: [admission, light, heavy, build, regex-python310, javascript]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binding-${{ github.run_attempt }}
          path: ci-binding
      - name: Verify exact admitted checkout
        run: python scripts/ci_test_gate.py checkout --binding ci-binding/binding.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require all phase-specific jobs
        env:
          PHASE_HEAVY: ${{ needs.admission.outputs.heavy }}
          LIGHT_RESULT: ${{ needs.light.result }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPAT_RESULT: ${{ needs.regex-python310.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
        run: python -c "import os; e=os.environ; expected='success' if e['PHASE_HEAVY']=='true' else 'skipped'; raise SystemExit(0 if e['LIGHT_RESULT']==e['COMPAT_RESULT']==e['JAVASCRIPT_RESULT']=='success' and e['HEAVY_RESULT']==e['BUILD_RESULT']==expected else 'incomplete CI phase')"
      - uses: actions/download-artifact@v8
        with:
          pattern: partition-${{ github.run_attempt }}-*
          path: partitions
      - name: Prove exact discovery coverage and recheck live PR head/main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_test_gate.py verdict --binding ci-binding/binding.json --reports partitions --output ci-verdict/verdict.json
      - uses: actions/upload-artifact@v7
        with:
          name: test-verdict-${{ github.run_attempt }}
          path: ci-verdict/verdict.json
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, regex-python310, verdict]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: yadinassi-*
          merge-multiple: true
          skip-decompress: true
          path: artifacts
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum yadinassi-* > SHA256SUMS
      - name: Publish release with all platform archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
